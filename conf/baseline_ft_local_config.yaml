# Qwen tier of the Model Scale x Adaptation x Rationale Alignment grid.
#
# Every arm here runs the same two-call flow (T1, then T2 conditioned on the
# predicted T1) and is evaluated under both inference styles (inf_bare,
# inf_cot). They differ in how the adaptation is carried:
#
#   zs, fs                    no adapter; nothing or exemplars in the prompt
#   ft_bare, ft_rat           two adapters, one per tier
#   ft1mix_*, ft1seq_*        one adapter serving both calls
#
# Driven by src/baseline/local_arm.py, which writes results into
# data/annotated/baseline/ in the layout src/baseline/eval.py reads, so the Qwen
# rows sit alongside the gpt-4o rows in one comparison.
#
# Usage:
#   PYTHONPATH=src python -m baseline.local_arm train   --target bare --ctx 5
#   PYTHONPATH=src python -m baseline.local_arm train   --target bare --regime mixed --ctx 5
#   PYTHONPATH=src python -m baseline.local_arm predict --arm ft_rat --inf cot --ctx 5
#
# Arm definitions and required artifacts: docs/EXPERIMENTS.md. Design rationale:
# docs/BASELINE.md. HF auth: docs/HF_SETUP.md (Qwen2.5-7B is non-gated, so no
# token is required).

defaults:
  - _self_

tier: qwen

dataset:
  # Fine-tuning data: held out from the evaluation set, no leakage.
  train_csv: data/manual/HLQC_balanced_manual.csv
  eval_csv: data/manual/MIV6.3A_manual.csv
  # Slug for the evaluation corpus. `miv63a` is the primary set and its result
  # files carry no dataset token (so existing results score unchanged). Override
  # together with eval_csv to evaluate on another corpus without clobbering, e.g.
  #   dataset.eval_csv=data/manual/AnnoMI_eval.csv dataset.eval_name=annomi
  eval_name: miv63a

annotator:
  context_mode: interval      # all | cumulative | interval
  num_context_turns: 5        # matches the completed gpt-4o rows; 3 is the paper setting
  # The original schema (response_formats.py) allows the full per-speaker T2
  # vocabulary, so default to full-vocab parsing to stay faithful to the
  # gpt-4o conditions; set true to constrain to the predicted T1 group.
  restrict_t2_to_group: false

# Frozen artifacts, both resolved per context length.
paths:
  adapter_dir: data/fine_tuning/baseline_local
  # The 1-adapter / 2-call arms, kept in their own tree so a single-adapter run
  # can never overwrite the two-adapter arm it is being compared against.
  adapter1_dir: data/fine_tuning/baseline_local_1a
  rationale_dir: data/fine_tuning/rationales
  fewshot_dir: data/fewshot
  output_dir: data/annotated/baseline

model:
  base_model: Qwen/Qwen2.5-7B-Instruct
  use_peft: true
  peft_r: 16
  peft_alpha: 32
  peft_dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  fp16: false
  bf16: true
  trust_remote_code: false
  attn_implementation: sdpa

training:
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 4
  num_train_epochs: 3
  learning_rate: 1e-4
  # Measured: the T1 prompt (codebook + Permission CoT + context) reaches ~3.0k
  # tokens at 5 volleys. 4096 leaves headroom so the target utterance, which
  # sits at the END of the prompt, is never the thing that gets truncated.
  max_length: 4096
  # ft_bare targets are a single code (~3 tokens); ft_rat targets are a rationale
  # plus label as JSON. Measured over the frozen ctx5 rationales with the Qwen2.5
  # tokenizer: mean 69, p99 138, max 247. Set above the max so no target is
  # truncated mid-sentence, which would train the model to emit unterminated JSON.
  max_target_length: 256
  validation_split: 0.0
  seed: 42
  logging_steps: 10
  save_steps: 100000
  save_total_limit: 1
  show_tqdm: true
  max_grad_norm: 1.0
  warmup_ratio: 0.05
  weight_decay: 0.0
  lr_scheduler_type: cosine
  gradient_checkpointing: true

  # Teacher-forcing axis. p_gold is the probability that a T2 training example is
  # conditioned on the GOLD T1 label rather than the out-of-fold predicted one,
  # evaluated once per epoch. Every arm in the grid is implicitly `full`; the
  # other two exist to measure what training on gold-only conditioning costs at
  # inference, where the T1 label is always predicted.
  #
  #   constant   eps(e) = value
  #   linear     eps(e) = start + (end - start) * e / (E - 1)   -> [1, .5, 0] at E=3
  #
  # `full` is trained rather than reused from ft_bare because a decaying rate
  # forces staged training, which forces a constant LR; the three must share one
  # procedure for the contrast between them to mean anything. See
  # `automisc_ft.train.train_t2_staged`.
  tf_modes:
    full: {kind: constant, value: 1.0}
    zero: {kind: constant, value: 0.0}
    dyn: {kind: linear, start: 1.0, end: 0.0}

inference:
  # Uniform across all eight cells, and deliberately generous. Four of the cells
  # measure instruction compliance (does a label-trained model emit a rationale
  # when asked, does a rationale-trained model suppress one when told to). A
  # tight budget would clip a non-compliant rationale mid-sentence and surface it
  # as a parse failure, turning a truncation artifact into a fake finding.
  max_new_tokens: 256
  # Per-arm input windows. Measured maxima at 5 volleys: zs/ft T1 ~3.0k, fs T1
  # ~5.4k (exemplar transcripts dominate). Qwen2.5 handles 32k, so the only cost
  # of the larger window is memory and speed on the few-shot arms.
  max_input_len:
    zs: 4096
    fs: 8192
    ft_bare: 4096
    ft_rat: 4096
    # The 1-adapter arms read the same prompts as ft_bare / ft_rat, so they get
    # the same window; only the adapter behind them differs.
    ft1mix_bare: 4096
    ft1mix_rat: 4096
    ft1seq_bare: 4096
    ft1seq_rat: 4096
    # The teacher-forcing variants read byte-identical prompts to ft_bare; only
    # which T1 label was injected during TRAINING differs.
    ft_bare_tffull: 4096
    ft_bare_tfdyn: 4096
    ft_bare_tfzero: 4096
    # Cell B variants read the same prompts again; only the adapter behind them
    # differs (one shared LoRA instead of a T1/T2 pair).
    ft1mix_bare_tffull: 4096
    ft1mix_bare_tfdyn: 4096
    ft1mix_bare_tfzero: 4096
  force_cpu: false

# Cap the number of evaluation utterances (null = all 821). Smoke testing only.
limit: null

checkpoint_every: 25
