# Two-call GRPO ladder on Qwen2.5-7B-Instruct (cells A and B of the matrix).
#
# Extends the RL grid past the single-call cell F. Four arms, crossing regime
# with credit scheme, each warm-started from the matching SFT two-call arm:
#
#   grpo_pair_dec    2 adapters, decoupled   (from ft_bare pair)
#   grpo_pair_joint  2 adapters, joint traj  (from ft_bare pair)
#   grpo_mix_dec     1 adapter,  decoupled   (from ft1mix_bare)
#   grpo_mix_joint   1 adapter,  joint traj  (from ft1mix_bare)
#
# Every knob below is COPIED from conf/grpo_config.yaml so the two-call arms
# differ from the single-call ladder in structure alone, never in optimisation.
# Only the paths and the two extra knobs at the bottom are new.
#
# Usage:
#   PYTHONPATH=src python -m baseline.grpo_tc train --regime pair --credit dec   --seed 0 --ctx 5
#   PYTHONPATH=src python -m baseline.grpo_tc train --regime mix  --credit joint --seed 0 --ctx 5
#   PYTHONPATH=src python -m baseline.grpo_tc predict --arm grpo_mix_dec --seed 0 --ctx 5
#
# See docs/GRPO_TWOCALL.md for the phase plan and budget.

defaults:
  - _self_

tier: qwen

dataset:
  train_csv: data/manual/HLQC_balanced_manual.csv
  eval_csv: data/manual/MIV6.3A_manual.csv

annotator:
  context_mode: interval
  num_context_turns: 5

paths:
  # Strictly disjoint from cell F (grpo) and the SFT arms (local_arm), so no run
  # can overwrite another and end compared against itself.
  grpo_tc_adapter_dir: data/fine_tuning/grpo_tc
  output_dir: data/annotated/baseline

model:
  base_model: Qwen/Qwen2.5-7B-Instruct
  use_peft: true
  peft_r: 16
  peft_alpha: 32
  peft_dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  fp16: false
  bf16: true
  trust_remote_code: false
  attn_implementation: sdpa

grpo:
  num_generations: 8
  num_train_epochs: 2
  learning_rate: 1e-6
  temperature: 1.0
  top_p: 1.0
  max_completion_length: 256

  beta: 0.02

  # MUST stay "none": the rare-class weight multiplies every rollout in a group
  # by one constant, so under "group" scaling it cancels. grpo_tc asserts this.
  scale_rewards: none
  loss_type: dr_grpo
  epsilon: 0.2
  num_iterations: 1

  per_device_train_batch_size: 4
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  max_grad_norm: 1.0
  warmup_ratio: 0.03
  lr_scheduler_type: constant_with_warmup

  # Rare-class emphasis on the gold T2 code (per speaker, TRAINING counts only).
  # For the pair regime it is applied to the T2 stage; for mix, to the T2 records
  # in the interleaved dataset. Toggled off for the Phase-2 ablation.
  rare_class_weighting: true
  weight_power: 0.5
  weight_floor: 0.5
  weight_ceiling: 3.0
  oversample_max_copies: 2

  # Checkpoint selection on the same conversation-level HLQC split as cell F.
  val_folds: 7
  val_fold: 0
  val_every_steps: 50
  val_max_examples: 200
  min_mean_rationale_words: 4.0

  log_completions: true
  num_completions_to_print: 4
  save_steps: 200
  logging_steps: 5

  # Joint-trajectory only: prompts sampled per optimizer step in the custom loop
  # (baseline.two_call_grpo). Kept small because each prompt already fans out to
  # num_generations T1 rollouts, each with its own T2 continuation.
  joint_prompts_per_step: 2

vllm:
  enabled: true
  mode: colocate
  gpu_memory_utilization: 0.45
  enable_sleep_mode: true
  max_model_length: 8192

inference:
  max_new_tokens: 256
  # Two-call prediction reuses TieredAnnotator; both calls fit 4096 at ctx5.
  max_input_len: 4096
  force_cpu: false
  batch_size: 16

limit: null
checkpoint_every: 25
